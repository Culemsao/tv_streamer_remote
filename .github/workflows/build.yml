name: Build

on:
  push:
    branches:
      - main # Verander naar 'master' als jouw hoofdbranch zo heet
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'rollup.config.js'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gecorrigeerd: npm install in plaats van npm ci om de lockfile-fout op te lossen
      - run: npm install
      
      - run: npm run build

      # Gecorrigeerd: Voegt de gecompileerde .js-file toe in plaats van een niet-bestaande dist/ map
      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Wijzig dit naar 'dist/' als jouw rollup.config.js het tóch in een dist-map zet
          git add google-tv-remote-card.js
          
          git diff --staged --quiet || git commit -m "build: update gecompileerde javascript"
          git push
